<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-lg p-4" style="max-width: 400px; width: 100%;">
      <h2 class="text-center mb-4">Connexion</h2>
      
      <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
        <!-- Adresse Email -->
        <div class="mb-3">
          <label for="adresse" class="form-label">Adresse Email</label>
          <input id="adresse" type="email" class="form-control" formControlName="adresse" placeholder="Votre email">
          <div class="text-danger" *ngIf="loginForm.get('adresse')?.invalid && loginForm.get('adresse')?.touched">
            <small *ngIf="loginForm.get('adresse')?.hasError('required')">L'adresse est requise.</small>
            <small *ngIf="loginForm.get('adresse')?.hasError('email')">Format invalide.</small>
          </div>
        </div>
  
        <!-- Mot de passe -->
        <div class="mb-3">
          <label for="password" class="form-label">Mot de passe</label>
          <input id="password" type="password" class="form-control" formControlName="password" placeholder="Votre mot de passe">
          <div class="text-danger" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            <small *ngIf="loginForm.get('password')?.hasError('required')">Le mot de passe est requis.</small>
            <small *ngIf="loginForm.get('password')?.hasError('minlength')">Au moins 6 caractères.</small>
          </div>
        </div>
  
        <!-- Bouton de connexion -->
        <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid">Se connecter</button>
  
        <!-- Message d'erreur -->
        <div *ngIf="errorMessage" class="text-danger text-center mt-3">
          {{ errorMessage }}
        </div>
      </form>
      
      <!-- Lien vers l'inscription -->
      <p class="text-center mt-3">
        Pas encore inscrit ? <a routerLink="/register">Créer un compte</a>
      </p>
    </div>
  </div>
